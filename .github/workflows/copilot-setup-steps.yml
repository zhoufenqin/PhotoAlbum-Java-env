# Windows-based Copilot Setup Steps for Java tasks
# Note: Windows runners have firewall limitations that may affect some network operations
# Use this workflow for Java projects that require Windows-specific tooling

name: "Copilot Setup Step (Windows)"

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version
